name: Build Android App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          echo "include ':app'" > settings.gradle
          mkdir -p app/src/main/java/com/example/naviparsertest
          mkdir -p app/src/main/res
          
          # 파일 배치 작업 (GitHub Actions가 알아서 앱 구조를 만듭니다)
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/example/naviparsertest/; fi
          if [ -f NaviNotificationListener.kt ]; then mv NaviNotificationListener.kt app/src/main/java/com/example/naviparsertest/; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/res/; fi
          
          echo 'apply plugin: "com.android.application"' > app/build.gradle
          # (간단한 빌드 스크립트 실행 과정...)
