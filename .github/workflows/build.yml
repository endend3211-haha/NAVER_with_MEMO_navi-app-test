name: Build Simple APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/naviparsertest
          mkdir -p app/src/main/res
          
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/example/naviparsertest/; fi
          if [ -f NaviNotificationListener.kt ]; then mv NaviNotificationListener.kt app/src/main/java/com/example/naviparsertest/; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/res/; fi

          echo "include ':app'" > settings.gradle
          echo 'rootProject.name = "NaviTest"' > build.gradle
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
          }
          apply plugin: 'com.android.application'
          
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.naviparsertest"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.0'
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      # v3에서 v4로 업그레이드 완료
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
